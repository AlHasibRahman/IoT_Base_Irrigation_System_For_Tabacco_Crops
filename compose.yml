services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - "1436:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "IrrigationDev_2026!Strong"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S", "localhost,1433",
          "-U", "sa",
          "-P", "IrrigationDev_2026!Strong",
          "-C",
          "-Q", "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  api:
    build: ./IrrigationApi
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=IrrigationDB;User Id=sa;Password=IrrigationDev_2026!Strong;Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./tobacco_irrigation_app
      args:
        API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sql_data:
    name: irrigationapi_sql_data